name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Check production editor in headless Chrome
        run: pnpm --dir web test:e2e

      - name: Upload synthetic editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-acceptance-screenshots
          path: web/test-results/
          if-no-files-found: ignore
